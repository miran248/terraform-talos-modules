apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - "fc00:1::/96"
nodeCIDRMaskSizeIPv6: 112
# /108 is the largest supported IPv6 service range; local uses /112.
# 20 bits is hardcoded here: https://github.com/kubernetes/kubernetes/blob/ec16c90aaf5d1f0606747c421c8680bb2b243d4e/cmd/kube-apiserver/app/options/validation.go#L40
serviceSubnets:
  - "fc00::/112"
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeletConfig
clusterDNS:
  - "fc00::a"
config:
  address: "::"
  healthzBindAddress: "::"
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false # doesn't work on single-stack IPv6; 169.254.116.108 is hardcoded
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: stable
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.core.somaxconn: "65535"
  net.core.netdev_max_backlog: "4096"
  net.ipv6.conf.all.forwarding: "1"
  net.ipv4.ip_forward: "1"
---
apiVersion: v1alpha1
kind: KubeSpanConfig
enabled: true
advertiseKubernetesNetworks: false
allowDownPeerBypass: false
harvestExtraEndpoints: false
mtu: 1420
